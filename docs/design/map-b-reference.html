<style>

.ib i{position:absolute;right:6px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 6px var(--lime)}

// ---------------------------------------------------------------- compose
const TIS = { skin, lung, blood, lymph, gut, brain };

// ---------------------------------------------------------------- the route: a capillary

  seg(w + 5, lit ? 'rgba(0,0,0,.55)' : 'rgba(0,0,0,.4)');

}

// ---------------------------------------------------------------- nodes (SVG)
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, at, parent) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (parent) parent.appendChild(e); return e; };
const STAR = 'M0,-1 L.235,-.324 .951,-.309 .38,.124 .588,.809 0,.4 -.588,.809 -.38,.124 -.951,-.309 -.235,-.324Z';
function nucleusD(r, seed) { const R = rng(seed), n = 18, ph = R() * 6; let d = ''; const P = []; for (let i = 0; i < n; i++) { const a = i / n * TAU, q = r * (1 + Math.sin(a * 2 + ph) * .06 + (R() - .5) * .05); P.push([Math.cos(a) * q, Math.sin(a) * q]); } for (let i = 0; i < n; i++) { const p = P[i], nx = P[(i + 1) % n], mx = (p[0] + nx[0]) / 2, my = (p[1] + nx[1]) / 2; d += i ? `Q${p[0].toFixed(1)},${p[1].toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)}` : `M${mx.toFixed(1)},${my.toFixed(1)}`; } return d + 'Z'; }
function buildSvg() {

    <radialGradient id="gD" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#e6eeff"/><stop offset=".35" stop-color="#8eaeff"/><stop offset=".8" stop-color="#3556d8"/><stop offset="1" stop-color="#1a2a7a"/></radialGradient>
    <radialGradient id="gN" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#fffbea"/><stop offset=".4" stop-color="#ffdf8a"/><stop offset=".85" stop-color="#e8921c"/><stop offset="1" stop-color="#8a4a08"/></radialGradient>
    <radialGradient id="gL" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#5b6a7c"/><stop offset=".7" stop-color="#28323f"/><stop offset="1" stop-color="#151b24"/></radialGradient>

    <radialGradient id="gC" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#f0e0ff"/><stop offset=".5" stop-color="#b07dff"/><stop offset="1" stop-color="#3f1a86"/></radialGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#ffc24a" stop-opacity=".55"/><stop offset="1" stop-color="#ffc24a" stop-opacity="0"/></radialGradient>
    <radialGradient id="haloB"><stop offset="0" stop-color="#7fa6ff" stop-opacity=".45"/><stop offset="1" stop-color="#7fa6ff" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".8"/></filter>

  </defs>`;

function chal(sv, x, y, kind, open) {

}
function node(sv, x, y, n) {

  const g = el('g', { class: 'node', transform: `translate(${x},${y})` }, sv);
  el('circle', { r: Math.max(24, r + 4), fill: 'transparent' }, g);
  if (next) {
    el('circle', { r: 56, fill: 'url(#halo)' }, g);
    for (const d of [0, 1.1]) { const c = el('circle', { r: r, fill: 'none', stroke: '#ffd37a', 'stroke-width': 2 }, g); el('animate', { attributeName: 'r', values: `${r};${r + 26}`, dur: '2.2s', begin: d + 's', repeatCount: 'indefinite' }, c); el('animate', { attributeName: 'opacity', values: '.9;0', dur: '2.2s', begin: d + 's', repeatCount: 'indefinite' }, c); }

}

    ['skin', 26, 534, 'REGION I · 01–03', 'SKIN', 'epidermis', '8/9'],
    ['lung', 30, 82, 'REGION II · 04–06', 'LUNGS', 'alveoli', '8/9'],

    ['lymph', 690, 714, 'REGION IV · 10–12', 'LYMPH NODE', 'germinal centres', ''],

  document.getElementById('cardStars').innerHTML = [0, 1, 2].map(() => `<svg viewBox="-1.2 -1.2 2.4 2.4"><path d="${STAR}" fill="rgba(255,194,74,.08)" stroke="rgba(255,214,140,.7)" stroke-width=".1"/></svg>`).join('') + '<small>0 / 3</small>';
}

// ---------------------------------------------------------------- live layer: red cells in the arch and the capillary
function live() {
  const cv = document.getElementById('fx'); cv.width = W * D; cv.height = H * D; const g = cv.getContext('2d');
  const R = rng(5), cells = Array.from({ length: 70 }, () => ({ s: R() * AORTA.len, o: (R() - .5) * 104, v: 50 + R() * 40, rot: R() * 3, t: .4 + R() * .6 }));
  let last = performance.now();
  const frame = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    g.setTransform(D, 0, 0, D, 0, 0); g.clearRect(0, 0, W, H); g.globalCompositeOperation = 'lighter';
    for (const c of cells) { c.s = (c.s + c.v * dt * (1 - Math.abs(c.o) / 80)) % AORTA.len; c.rot += dt; const q = at(AORTA, c.s); rbc(g, q.x + q.nx * c.o, q.y + q.ny * c.o, 6, c.rot, c.t, .55); }

    requestAnimationFrame(frame);
