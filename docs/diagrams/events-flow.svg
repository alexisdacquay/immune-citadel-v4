<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="events-flow-title events-flow-desc" id="events-flow-root">
        <title id="events-flow-title">How gameplay events travel</title>
        <desc id="events-flow-desc">The game, when its stats switch is on, posts events to the save API at /api/play; only valid events reach the Postgres events table, which four SQL views read: funnel, level_stats, card_reads and sittings.</desc>
        <defs>
      <style>#events-flow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #events-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #events-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#events-flow-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="events-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="events-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Callout: when the game sends (the Mermaid edge label) -->
        <text x="40" y="52" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">the open event is sent at once;</text>
        <text x="40" y="72" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">the rest at each level end and when the tab is hidden</text>
        <path d="M 196 84 Q 228 96 228 144" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>

        <!-- Connectors before nodes -->
        <line x1="176" y1="148" x2="280" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#events-flow-arrow)"/>
        <line x1="432" y1="148" x2="544" y2="148" stroke="#bf4520" stroke-width="1.2" marker-end="url(#events-flow-arrow-accent)"/>
        <line x1="680" y1="148" x2="760" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#events-flow-arrow)"/>

        <circle cx="228" cy="148" r="2" fill="#2d3142"/>

        <!-- Arrow label: mask bottom at 140, stroke at 148 (8px gap) -->
        <rect x="452" y="128" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="488" y="137" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">VALID EVENTS</text>

        <!-- Game (input) -->
        <rect x="40" y="112" width="136" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="112" width="136" height="72" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="108" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Game</text>
        <text x="108" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">stats switch on</text>

        <!-- Save API (focal) -->
        <rect x="280" y="112" width="152" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="112" width="152" height="72" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="356" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Save API</text>
        <text x="356" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">POST /api/play</text>

        <!-- Postgres (store) -->
        <rect x="544" y="112" width="136" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="544" y="112" width="136" height="72" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="612" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Postgres</text>
        <text x="612" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">table events</text>

        <!-- SQL views (query) -->
        <rect x="760" y="112" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="112" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="840" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">SQL views</text>
        <text x="840" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">funnel, level_stats,</text>
        <text x="840" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">card_reads, sittings</text>

        <!-- Legend strip -->
        <line x1="40" y1="232" x2="920" y2="232" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="128" y="244" width="16" height="12" rx="2" fill="#4f5d75" stroke="#5a6580" fill-opacity="0.10"/>
        <text x="152" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">INPUT</text>
        <rect x="224" y="244" width="16" height="12" rx="2" fill="#bf4520" stroke="#bf4520" fill-opacity="0.08"/>
        <text x="248" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">FOCAL</text>
        <rect x="320" y="244" width="16" height="12" rx="2" fill="#2d3142" stroke="#4f5d75" fill-opacity="0.05"/>
        <text x="344" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">STORE</text>
        <rect x="416" y="244" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142"/>
        <text x="440" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">QUERY</text>
      </svg>
