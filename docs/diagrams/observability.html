<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observability target</title>
  <!-- Font source: system (no Google Fonts link); the stacks fall through to platform faces. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · from Mermaid · doc-inline</p>
    <h1>Observability target</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="observability-title observability-desc">
        <title id="observability-title">Observability target</title>
        <desc id="observability-desc">The player's browser and the save API report errors to Sentry, Better Stack and the CI deployed job check the static site and the save API, and all three tools email the owner.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors first (behind boxes) -->
        <!-- browser -> Sentry -->
        <path d="M200,84 H560" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- browser -> save API -->
        <path d="M200,108 H320 Q328,108 328,116 V208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- save API -> Sentry -->
        <path d="M408,208 V176 Q408,168 416,168 H592 Q600,168 600,160 V128" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- save API -> Postgres -->
        <path d="M288,240 H200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Better Stack -> save API (planned) -->
        <path d="M560,240 H448" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- Better Stack -> owner -->
        <path d="M720,240 H800" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Sentry -> owner -->
        <path d="M720,96 H852 Q860,96 860,104 V208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Better Stack -> static site -->
        <path d="M600,272 V312 Q600,320 592,320 H416 Q408,320 408,328 V352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- CI -> static site -->
        <path d="M200,384 H288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- CI -> save API -->
        <path d="M160,352 V312 Q160,304 168,304 H320 Q328,304 328,296 V272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- CI -> owner (red run) -->
        <path d="M120,416 V456 Q120,464 128,464 H852 Q860,464 860,456 V272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels (masked, 8px above their segment or beside a vertical one) -->
        <rect x="340" y="64" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="382" y="73" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ERRORS + SPEED</text>

        <rect x="252" y="156" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="286" y="165" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PLAY EVENTS</text>

        <rect x="472" y="148" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="506" y="157" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SAVE ERRORS</text>

        <rect x="472" y="220" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="506" y="229" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FROM STEP 6</text>

        <rect x="740" y="220" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="760" y="229" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EMAIL</text>

        <rect x="764" y="76" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="784" y="85" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EMAIL</text>

        <rect x="472" y="300" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="506" y="309" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EVERY 5 MIN</text>

        <rect x="208" y="364" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="244" y="373" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">AFTER DEPLOY</text>

        <rect x="448" y="444" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="490" y="453" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RED RUN: EMAIL</text>

        <!-- Nodes -->
        <!-- Player's browser (person / input) -->
        <rect x="40" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="64" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="120" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Player's browser</text>
        <text x="120" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">game + Sentry SDK</text>

        <!-- Sentry (focal) -->
        <rect x="560" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="64" width="160" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="640" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Sentry</text>
        <text x="640" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">EU region</text>

        <!-- Postgres (store) -->
        <rect x="40" y="208" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="208" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="120" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Postgres</text>
        <text x="120" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">saves + events</text>

        <!-- Save API (our service) -->
        <rect x="288" y="208" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="208" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="368" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Save API</text>

        <!-- Better Stack (outside tool) -->
        <rect x="560" y="208" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="208" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="640" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Better Stack</text>
        <text x="640" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">uptime</text>

        <!-- Owner (person / input) -->
        <rect x="800" y="208" width="120" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="800" y="208" width="120" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="860" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Owner</text>

        <!-- CI job (outside tool) -->
        <rect x="40" y="352" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="352" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="120" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">CI job</text>
        <text x="120" y="396" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">deployed</text>

        <!-- Static site (our service) -->
        <rect x="288" y="352" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="352" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="368" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Static site</text>

        <!-- Legend strip -->
        <line x1="40" y1="528" x2="920" y2="528" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="561" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="128" y="552" width="16" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="152" y="561" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Focal tool</text>

        <rect x="248" y="552" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="272" y="561" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Our service</text>

        <rect x="372" y="552" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="396" y="561" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Data store</text>

        <rect x="492" y="552" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="516" y="561" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Outside tool</text>

        <rect x="620" y="552" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="644" y="561" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Person</text>

        <line x1="728" y1="558" x2="756" y2="558" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="764" y="561" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Planned, not live yet</text>
      </svg>
    </div>
  </div>
</body>
</html>
