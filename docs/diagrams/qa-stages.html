<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA stages</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · QA · ci.yml and tools/qa.js</p>
    <h1>Two QA stages on every pull request into dev</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="qa-stages-title qa-stages-desc">
        <title id="qa-stages-title">Two QA stages on every pull request into dev</title>
        <desc id="qa-stages-desc">A pull request into dev runs test and game and, beside them, stage 1 qa, which asks closed YES or NO questions from the builder's QA checks and the past failures in the files it changes; after test and game pass, stage 2 qa-review only comments; GitHub merges once test, game and qa are green, Render deploys dev, the deployed job proves the commit is live, and production follows only when the owner merges dev into main.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ Arrows (drawn first, behind nodes) ============ -->

        <!-- pull request -> test + game -->
        <line x1="224" y1="192" x2="320" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- pull request -> qa: its ## QA checks -->
        <path d="M 224 216 H 264 Q 272 216 272 224 V 304 Q 272 312 280 312 H 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- past failures -> qa: only those whose files the change touches -->
        <line x1="224" y1="344" x2="320" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- test + game -> qa-review (needs: test, game) -->
        <line x1="432" y1="172" x2="432" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- qa-review -> pull request: a comment, never a gate -->
        <path d="M 320 92 H 140 Q 132 92 132 100 V 168" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- test + game -> auto-merge -->
        <line x1="544" y1="192" x2="656" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- qa -> auto-merge -->
        <path d="M 544 328 H 596 Q 604 328 604 320 V 224 Q 604 216 612 216 H 656" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- auto-merge -> Render deploys dev -> deployed -->
        <line x1="788" y1="240" x2="788" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="788" y1="352" x2="788" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- deployed -> owner merges dev into main -->
        <line x1="656" y1="452" x2="544" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ============ Arrow labels (opaque masks, 8px from their stroke) ============ -->
        <rect x="200" y="72" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="228" y="81" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">COMMENTS</text>

        <rect x="440" y="144" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="474" y="153" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">AFTER GREEN</text>

        <rect x="280" y="252" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="310" y="261" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">QA CHECKS</text>

        <rect x="232" y="324" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="272" y="333" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FILES CHANGED</text>

        <rect x="560" y="432" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="600" y="441" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">OWNER'S CALL</text>

        <!-- ============ Callouts (margins) ============ -->
        <text x="584" y="84" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">advisory: it never blocks the merge;</text>
        <text x="584" y="102" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">every finding is fixed or answered</text>
        <text x="584" y="120" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">before a promotion to production</text>
        <path d="M 576 80 Q 560 80 546 76" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="544" cy="76" r="2" fill="#2d3142"/>

        <text x="40" y="420" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">a [changes] check must be YES on</text>
        <text x="40" y="438" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">the new code and not YES on the old,</text>
        <text x="40" y="456" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">so it really tests the change</text>
        <path d="M 236 404 Q 360 404 360 380" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="360" cy="378" r="2" fill="#2d3142"/>

        <!-- ============ Nodes ============ -->

        <!-- Pull request into dev (input) -->
        <rect x="40" y="168" width="184" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="168" width="184" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="132" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Pull request into dev</text>
        <text x="132" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">its ## QA checks,</text>
        <text x="132" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">written by the builder</text>

        <!-- Past failures (store) -->
        <rect x="40" y="296" width="184" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="296" width="184" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="132" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Past failures</text>
        <text x="132" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">test/past-failures.md</text>

        <!-- Stage 2: qa-review (optional / advisory) -->
        <rect x="320" y="56" width="224" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="56" width="224" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="328" y="64" width="48" height="12" rx="2" fill="none" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="352" y="73" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ADVISORY</text>
        <text x="432" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Stage 2: qa-review</text>
        <text x="432" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">open review of the diff</text>

        <!-- test + game (CI jobs) -->
        <rect x="320" y="172" width="224" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="172" width="224" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="328" y="180" width="48" height="12" rx="2" fill="none" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="352" y="189" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">REQUIRED</text>
        <text x="432" y="210" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">test + game</text>
        <text x="432" y="226" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">unit, integration, game bot</text>

        <!-- Stage 1: qa (focal) -->
        <rect x="320" y="280" width="224" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="280" width="224" height="96" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="328" y="288" width="48" height="12" rx="2" fill="none" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="352" y="297" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">REQUIRED</text>
        <text x="432" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Stage 1: qa</text>
        <text x="432" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">closed YES/NO, low effort</text>
        <text x="432" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3 votes each, majority wins</text>
        <text x="432" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">any failed check fails it</text>

        <!-- GitHub auto-merges into dev -->
        <rect x="656" y="168" width="264" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="656" y="168" width="264" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="788" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GitHub auto-merges into dev</text>
        <text x="788" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">once test, game and qa are green</text>

        <!-- Render deploys dev -->
        <rect x="656" y="296" width="264" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="656" y="296" width="264" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="788" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Render deploys dev</text>
        <text x="788" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">every commit on dev</text>

        <!-- CI job: deployed -->
        <rect x="656" y="420" width="264" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="656" y="420" width="264" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="788" y="446" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">CI job: deployed</text>
        <text x="788" y="462" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">/health and /version.txt</text>
        <text x="788" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">serve the new commit</text>

        <!-- Owner merges dev into main (focal: the production gate) -->
        <rect x="320" y="416" width="224" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="416" width="224" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="432" y="446" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Owner merges dev into main</text>
        <text x="432" y="462" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">test, game, dev-green;</text>
        <text x="432" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">then production deploys</text>

        <!-- ============ Legend ============ -->
        <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="564" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="72" y="574" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Input</text>

        <rect x="116" y="564" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="148" y="574" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">CI job or step</text>

        <rect x="232" y="564" width="24" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="264" y="574" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Stored checks</text>

        <rect x="348" y="564" width="24" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="380" y="574" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Advisory, never blocks</text>

        <rect x="500" y="564" width="24" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="532" y="574" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Gate: QA, then the owner</text>

        <line x1="660" y1="570" x2="688" y2="570" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="696" y="574" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Next step</text>

        <line x1="780" y1="570" x2="808" y2="570" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="816" y="574" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Comment only</text>
      </svg>
    </div>
  </div>
</body>
</html>
