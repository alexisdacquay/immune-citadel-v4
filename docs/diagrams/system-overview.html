<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Immune Citadel · System overview</title>
  <!-- Font source: system (no Google Fonts link), so this page matches the exported SVG the README shows. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 840px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Immune Citadel</p>
    <h1>How it fits together</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 840 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-overview-title system-overview-desc">
        <title id="system-overview-title">How Immune Citadel fits together</title>
        <desc id="system-overview-desc">The player's browser runs the whole game and reads and writes saves through the Node save API, which stores them in Postgres and sends errors and traces to Sentry in the EU, which e-mails the owner on a save API error.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first, behind the boxes -->
        <!-- Browser -> Save API: HTTP call -->
        <line x1="224" y1="80" x2="320" y2="80" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Save API -> Postgres -->
        <line x1="528" y1="80" x2="624" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Save API -> Sentry: async telemetry, dashed -->
        <line x1="424" y1="120" x2="424" y2="184" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- Sentry -> owner's e-mail -->
        <line x1="512" y1="224" x2="624" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels: opaque masks, 8px clear of their strokes -->
        <rect x="240" y="60" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="272" y="69" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">GET / PUT</text>

        <rect x="432" y="146" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="476" y="155" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">ERRORS, TRACES</text>

        <rect x="548" y="204" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="568" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">ALERT</text>

        <!-- Node: Player's browser (user) -->
        <rect x="40" y="40" width="184" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="40" width="184" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="48" width="36" height="12" rx="2" fill="none" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="66" y="57" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
        <text x="132" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Player's browser</text>
        <text x="132" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">index.html, the whole game</text>

        <!-- Node: Save API (focal) -->
        <rect x="320" y="40" width="208" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="40" width="208" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="328" y="48" width="24" height="12" rx="2" fill="none" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="340" y="57" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="424" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Save API</text>
        <text x="424" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Node, server/</text>
        <text x="424" y="110" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">/api/save/:code</text>

        <!-- Node: Postgres (store) -->
        <rect x="624" y="40" width="176" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="624" y="40" width="176" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="632" y="48" width="20" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="642" y="57" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="712" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Postgres</text>

        <!-- Node: Sentry (external service) -->
        <rect x="336" y="184" width="176" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="336" y="184" width="176" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="344" y="192" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="358" y="201" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">SAAS</text>
        <text x="424" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Sentry</text>
        <text x="424" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">EU region</text>
        <text x="424" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">rule: Save API error</text>

        <!-- Node: Owner's e-mail (user) -->
        <rect x="624" y="184" width="176" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="624" y="184" width="176" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="632" y="192" width="32" height="12" rx="2" fill="none" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="648" y="201" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">INBOX</text>
        <text x="712" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Owner's e-mail</text>

        <!-- Legend strip -->
        <line x1="40" y1="300" x2="800" y2="300" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="316" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="328" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="60" y="336" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Person</text>

        <rect x="120" y="328" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="140" y="336" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Focal</text>

        <rect x="196" y="328" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="216" y="336" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Store</text>

        <rect x="272" y="328" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="292" y="336" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">External service</text>

        <line x1="400" y1="333" x2="428" y2="333" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="436" y="336" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">HTTP request</text>

        <line x1="524" y1="333" x2="552" y2="333" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="560" y="336" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Connection</text>

        <line x1="656" y1="333" x2="684" y2="333" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="692" y="336" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Async telemetry</text>
      </svg>
    </div>
  </div>
</body>
</html>
