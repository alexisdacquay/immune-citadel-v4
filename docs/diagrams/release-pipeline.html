<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Release pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Releases</p>
    <h1>From issue branch to production</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="release-pipeline-title release-pipeline-desc">
        <title id="release-pipeline-title">Release pipeline: issue branch to production</title>
        <desc id="release-pipeline-desc">A change goes from an issue branch through a pull request whose required checks test, game and qa must pass, into dev by GitHub auto-merge; Render deploys dev and the CI job deployed checks the deploy; then the owner merges dev into main once test, game and dev-green pass, and Render deploys production, checked the same way; a red result sends the change back to its branch or makes GitHub email the owner.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ Arrows (drawn first, behind nodes) ============ -->

        <!-- Row 1: issue branch → pull request → CI -->
        <line x1="212" y1="128" x2="316" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="500" y1="128" x2="560" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- CI red → back to the issue branch (loop above row 1) -->
        <path d="M 620 92 V 72 Q 620 64 612 64 H 156 Q 148 64 148 72 V 104" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- CI green → GitHub auto-merges into dev (wrap to row 2) -->
        <path d="M 620 164 V 184 Q 620 192 612 192 H 156 Q 148 192 148 200 V 260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Row 2: auto-merge → Render deploys dev → CI deployed -->
        <line x1="236" y1="288" x2="324" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="492" y1="288" x2="560" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- CI deployed red → GitHub emails the owner -->
        <line x1="680" y1="288" x2="728" y2="288" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- CI deployed green → owner merges dev into main (wrap to row 3) -->
        <path d="M 620 324 V 344 Q 620 352 612 352 H 156 Q 148 352 148 360 V 420" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Row 3: owner merge → Render deploys production → CI deployed -->
        <line x1="256" y1="448" x2="304" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="512" y1="448" x2="560" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ============ Arrow labels (opaque masks, 8px gap) ============ -->
        <rect x="368" y="44" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="384" y="53" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RED</text>

        <rect x="364" y="172" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="384" y="181" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GREEN</text>

        <rect x="688" y="268" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="704" y="277" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RED</text>

        <rect x="364" y="332" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="384" y="341" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GREEN</text>

        <!-- ============ Row 1: into a pull request ============ -->

        <!-- issue branch -->
        <rect x="84" y="104" width="128" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="84" y="104" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="148" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">issue branch</text>

        <!-- pull request into dev -->
        <rect x="316" y="104" width="184" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="316" y="104" width="184" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="408" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">pull request into dev</text>

        <!-- CI: test + game -->
        <polygon points="620,92 680,128 620,164 560,128" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="620" y="127" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">CI</text>
        <text x="620" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">test+game+qa</text>

        <!-- ============ Row 2: dev ============ -->

        <!-- GitHub auto-merges into dev -->
        <rect x="60" y="260" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="60" y="260" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="148" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GitHub auto-merges</text>
        <text x="148" y="302" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">into dev · the only way in</text>

        <!-- Render deploys dev -->
        <rect x="324" y="264" width="168" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="324" y="264" width="168" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="408" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Render deploys dev</text>

        <!-- CI: deployed (dev) -->
        <polygon points="620,252 680,288 620,324 560,288" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="620" y="287" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">CI</text>
        <text x="620" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">deployed</text>

        <!-- GitHub emails the owner -->
        <rect x="728" y="264" width="192" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="728" y="264" width="192" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="824" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GitHub emails the owner</text>

        <!-- ============ Row 3: production ============ -->

        <!-- owner merges dev into main (focal: the production gate) -->
        <rect x="40" y="420" width="216" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="420" width="216" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="148" y="446" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">owner merges dev into main</text>
        <text x="148" y="462" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">needs test, game, dev-green</text>

        <!-- Render deploys production -->
        <rect x="304" y="424" width="208" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="304" y="424" width="208" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="408" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Render deploys production</text>

        <!-- CI: deployed (production) -->
        <polygon points="620,412 680,448 620,484 560,448" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="620" y="447" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">CI</text>
        <text x="620" y="460" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">deployed</text>

        <!-- ============ Legend ============ -->
        <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="568" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="72" y="578" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Step</text>

        <polygon points="132,574 144,568 156,574 144,580" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="164" y="578" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">CI check (GitHub Actions)</text>

        <rect x="340" y="568" width="24" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="372" y="578" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Production gate (owner)</text>

        <line x1="536" y1="574" x2="564" y2="574" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="572" y="578" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Green: next step</text>

        <line x1="700" y1="574" x2="728" y2="574" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="736" y="578" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Red: back, or an email</text>
      </svg>
    </div>
  </div>
</body>
</html>
