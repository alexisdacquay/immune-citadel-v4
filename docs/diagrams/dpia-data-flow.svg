<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dpia-data-flow-title dpia-data-flow-desc" id="dpia-data-flow-root">
        <title id="dpia-data-flow-title">Where a player's data goes</title>
        <desc id="dpia-data-flow-desc">The player's browser sends game saves and anonymous gameplay events to the save API, which stores them in Postgres on Render in Frankfurt; crash reports, page-load speed, server errors and request traces go to Sentry's EU region in Frankfurt.</desc>
        <defs>
      <style>#dpia-data-flow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #dpia-data-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #dpia-data-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#dpia-data-flow-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="dpia-data-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="dpia-data-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="dpia-data-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: every server-side store sits in the EU, in Frankfurt -->
        <rect x="368" y="128" width="544" height="304" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="380" y="132" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="430" y="141" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">EU · FRANKFURT</text>

        <!-- Arrows (before nodes) -->
        <!-- browser -> save API: game save -->
        <path d="M224,184 H400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dpia-data-flow-arrow)"/>
        <!-- browser -> save API: gameplay events, optional (stats switch) -->
        <path d="M224,208 H400" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#dpia-data-flow-arrow)"/>
        <!-- save API -> Postgres -->
        <path d="M576,196 H720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dpia-data-flow-arrow)"/>
        <!-- save API -> Sentry -->
        <path d="M488,232 V344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dpia-data-flow-arrow)"/>
        <!-- browser -> Sentry -->
        <path d="M136,232 V368 Q136,376 144,376 H400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dpia-data-flow-arrow)"/>

        <!-- Arrow labels (masked, 6px gap) -->
        <rect x="282" y="166" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="312" y="175" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GAME SAVE</text>
        <rect x="268" y="214" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="312" y="223" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ANONYMOUS PLAY</text>
        <rect x="608" y="178" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="648" y="187" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SAVES, EVENTS</text>
        <rect x="496" y="282" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="540" y="291" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ERRORS, TRACES</text>
        <rect x="228" y="358" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="272" y="367" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CRASHES, SPEED</text>

        <!-- Callout: the save code -->
        <text x="248" y="96" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">saved under a random 16-character code</text>
        <path d="M256,104 Q250,144 256,180" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <circle cx="256" cy="184" r="2" fill="#2d3142"/>

        <!-- Nodes -->
        <!-- Player's browser (input) -->
        <rect x="48" y="160" width="176" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="160" width="176" height="72" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="56" y="166" width="40" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="76" y="175" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
        <text x="136" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Player's browser</text>

        <!-- Save API (focal) -->
        <rect x="400" y="160" width="176" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="160" width="176" height="72" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="408" y="166" width="28" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="422" y="175" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="488" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Save API</text>
        <text x="488" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Render</text>

        <!-- Postgres (store) -->
        <rect x="720" y="160" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="720" y="160" width="160" height="72" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="728" y="166" width="24" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="740" y="175" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="800" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Postgres</text>
        <text x="800" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Render</text>

        <!-- Sentry (external) -->
        <rect x="400" y="344" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="344" width="176" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="408" y="350" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="424" y="359" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SAAS</text>
        <text x="488" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Sentry</text>
        <text x="488" y="396" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">processor</text>

        <!-- Legend strip -->
        <line x1="48" y1="488" x2="912" y2="488" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="48" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="128" y="506" width="16" height="12" rx="2" fill="#bf4520" stroke="#bf4520" fill-opacity="0.08"/>
        <text x="152" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">FOCAL</text>
        <rect x="216" y="506" width="16" height="12" rx="2" fill="#4f5d75" stroke="#5a6580" fill-opacity="0.10"/>
        <text x="240" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">CLIENT</text>
        <rect x="312" y="506" width="16" height="12" rx="2" fill="#2d3142" stroke="#4f5d75" fill-opacity="0.05"/>
        <text x="336" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">STORE</text>
        <rect x="400" y="506" width="16" height="12" rx="2" fill="#2d3142" stroke="#2d3142" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="424" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">EXTERNAL SERVICE</text>
        <line x1="536" y1="512" x2="568" y2="512" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="580" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">PLAYER CAN SWITCH OFF (STATS SWITCH)</text>
      </svg>
