# Grafana alerting, provisioned at start (docker compose). One alert, on user impact:
# "Cloud saves failing" fires when any save in the last 5 minutes was answered with a server error,
# that is, a player's progress did not reach the cloud. It calls the on-call responder (oncall/responder.js).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: oncall-responder
    receivers:
      - uid: oncall-webhook
        type: webhook
        settings:
          url: http://host.docker.internal:8790/alert

groups:
  - orgId: 1
    name: user-impact
    folder: Immune Citadel
    interval: 10s
    rules:
      - uid: cloud-saves-failing
        title: Cloud saves failing
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: Players' cloud saves fail with server errors; their progress does not reach the cloud.
          runbook: docs/OPERATIONS.md#alert-cloud-saves-failing
        notification_settings:
          receiver: oncall-responder
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(increase(saves_total{service_name="immune-citadel-api", outcome="failed"}[5m])) or vector(0)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0.5] } }]
