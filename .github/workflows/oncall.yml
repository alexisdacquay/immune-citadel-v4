# On-call agent (#27): a Sentry alert opens an issue in this repository through Sentry's GitHub integration, and this job wakes on it.
# tools/oncall.js reads the error from Sentry, asks DeepSeek for the smallest fix with a regression test, runs the unit tests, and opens
# a pull request into dev, which merges like any other on test, game and qa. Production stays the owner's.
# Only Sentry's own issues, or an issue a maintainer labels "incident", wake it: a stranger's issue never does. A maintainer can also
# run it by hand on an issue (Actions > On-call > Run workflow).
name: On-call
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue: { description: 'Incident issue number', required: true }
      sentry_issue: { description: 'Sentry issue id or short id (optional; else read from the issue)', required: false }
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency: # one agent per incident: a second alert or label on the same issue waits, then finds the pull request and stops
  group: oncall-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  respond:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'opened' && github.event.issue.user.type == 'Bot' && contains(github.event.issue.user.login, 'sentry')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'incident')
    runs-on: ubuntu-latest
    timeout-minutes: 30 # a model answer takes up to a few minutes, the unit tests about one; at most 3 attempts
    steps:
      # A person's token (ONCALL_TOKEN), when set, so the agent's push and pull request start CI: GitHub starts no workflow for GITHUB_TOKEN.
      - uses: actions/checkout@v5
        with: { ref: dev, fetch-depth: 0, token: '${{ secrets.ONCALL_TOKEN || github.token }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: git config user.name 'immune-citadel on-call agent' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: node tools/oncall.js
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          SENTRY_ISSUE: ${{ inputs.sentry_issue }}
          GH_TOKEN: ${{ secrets.ONCALL_TOKEN || github.token }}
          AUTOMERGE: ${{ secrets.ONCALL_TOKEN != '' && '1' || '' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
