# CI: every pull request and every push to dev or main runs the unit and integration tests (test) and the game suite (game);
# every pull request then gets an independent QA verdict (qa).
# CD is Render's: each environment deploys every commit on its branch (dev -> dev, main -> prod); the rules on dev and main
# let a commit in only through a pull request whose test and game passed. On those pushes, "deployed" proves the commit went live.
name: CI
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # usually ~1 min
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci # its postinstall downloads Chromium; no install-deps: the runner image ships Chrome's libraries, and the extra fonts it adds come from an Ubuntu mirror that stalled two runs past their timeout (2026-11-06)
      - run: npm test
      - if: failure()
        run: docker compose logs --tail 80

  game:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # usually 6-7 min, up to ~16 on a slow runner; a hang must not block deploys for GitHub's default 6 h
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci # its postinstall downloads Chromium; no install-deps: the runner image ships Chrome's libraries, and the extra fonts it adds come from an Ubuntu mirror that stalled two runs past their timeout (2026-11-06)
      - run: npm run test:game # every level played by a bot, saves, challenges, Field Guide, phone and tablet layouts (~6 min)

  qa: # an independent QA agent judges the pull request against its issues' acceptance criteria (tools/qa.js); required on dev and main
    if: github.event_name == 'pull_request'
    needs: [test, game]
    runs-on: ubuntu-latest
    timeout-minutes: 10 # usually under 2 min
    permissions: { contents: read, issues: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # The judge comes from the base branch, never from the pull request it judges: a pull request cannot rewrite its own QA.
      # Only the pull request that first adds tools/qa.js (none on the base yet) runs its own copy.
      - run: git show "${{ github.event.pull_request.base.sha }}:tools/qa.js" > "$RUNNER_TEMP/qa.js" 2>/dev/null || cp tools/qa.js "$RUNNER_TEMP/qa.js"
      - run: node "$RUNNER_TEMP/qa.js"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}

  dev-green: # a pull request into main (a promotion) waits for dev's own CI run on the same commit, deploy proof included, and fails unless it is green
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { actions: read, contents: read }
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 50); do
            r=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch dev --event push --commit "$SHA" --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
            case "$r" in
              "completed success") echo "dev is green at $SHA"; exit 0 ;;
              completed*) echo "::error::dev's CI run on $SHA ended '$r': fix dev before promoting"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::no finished CI run on dev for $SHA (promotions come from dev)"; exit 1

  deployed: # after a push to dev or main: proof that Render now serves this commit (API /health and site /version.txt), red otherwise
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20 # the script gives up after 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/verify-deploy.js
        env:
          SHA: ${{ github.sha }}
          API: ${{ github.ref_name == 'main' && 'https://immune-citadel-v4-api.onrender.com' || 'https://immune-citadel-v4-api-dev.onrender.com' }}
          SITE: ${{ github.ref_name == 'main' && 'https://immune-citadel-v4.onrender.com' || 'https://immune-citadel-v4-dev.onrender.com' }}
          GITHUB_TOKEN: ${{ github.token }}
