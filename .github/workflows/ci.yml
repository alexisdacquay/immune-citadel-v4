# CI: every pull request and every push to dev or main runs the unit and integration tests (test) and the game suite (game);
# every pull request into dev also gets an independent QA agent in two stages: qa (closed checks, required) and qa-review (open review, advisory).
# CD is Render's: each environment deploys every commit on its branch (dev -> dev, main -> prod); the rules on dev and main
# let a commit in only through a pull request whose test and game passed. On those pushes, "deployed" proves the commit went live.
name: CI
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # usually ~1 min
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci # its postinstall downloads Chromium; no install-deps: the runner image ships Chrome's libraries, and the extra fonts it adds come from an Ubuntu mirror that stalled two runs past their timeout (2026-11-06)
      - run: npm test
      - if: failure()
        run: docker compose logs --tail 80

  game:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # usually 6-7 min, up to ~16 on a slow runner; a hang must not block deploys for GitHub's default 6 h
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci # its postinstall downloads Chromium; no install-deps: the runner image ships Chrome's libraries, and the extra fonts it adds come from an Ubuntu mirror that stalled two runs past their timeout (2026-11-06)
      - run: npm run test:game # every level played by a bot, saves, challenges, Field Guide, phone and tablet layouts (~6 min)

  qa: # stage 1, required on dev: an independent QA agent answers closed questions, YES or NO at low effort (tools/qa.js):
    # the pull request's own "## QA checks" and the past failures in the files it changes (test/past-failures.md).
    # Not on promotions into main (owner, 2026-11-07): each change already passed it into dev, and judging the whole release
    # diff at once produced false alarms (#73); main is gated by test, game, dev-green and the owner.
    # No "needs": it reads code, not test results, so it runs beside test and game and adds no wait.
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # each question takes seconds; a model call gives up after 4 min and is tried at most 3 times
    permissions: { contents: read, issues: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # The judge comes from the base branch, never from the pull request it judges: a pull request cannot rewrite tools/qa.js for its
      # own run (only the one that first adds it runs its own copy). Known gap: GitHub reads this workflow file from the pull request,
      # so a pull request that edits it can change this job.
      - run: git show "${{ github.event.pull_request.base.sha }}:tools/qa.js" > "$RUNNER_TEMP/qa.js" 2>/dev/null || cp tools/qa.js "$RUNNER_TEMP/qa.js"
      - run: node "$RUNNER_TEMP/qa.js"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }} # the merge this pull request would make, so a branch behind dev is judged on what lands
          GITHUB_TOKEN: ${{ github.token }}

  # Stage 2 (owner, 2026-11-07): the open review, unchanged, advisory. It comments on the pull request and never blocks
  # (not a required check, and tools/qa.js exits 0); before a promotion every finding it raises is fixed or answered.
  qa-review: # stage 2, advisory: the open review (tools/qa.js, QA_MODE=review); not required.
    # Not on promotions into main (owner, 2026-11-07): each change already passed it into dev, and judging the whole release
    # diff at once produced false alarms (#73); main is gated by test, game, dev-green and the owner.
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    needs: [test, game]
    runs-on: ubuntu-latest
    timeout-minutes: 15 # usually 1-4 min; the model call gives up after 12
    permissions: { contents: read, issues: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # The judge comes from the base branch, never from the pull request it judges: a pull request cannot rewrite tools/qa.js for its
      # own run (only the one that first adds it runs its own copy). Known gap: GitHub reads this workflow file from the pull request,
      # so a pull request that edits it can change this job.
      - run: git show "${{ github.event.pull_request.base.sha }}:tools/qa.js" > "$RUNNER_TEMP/qa.js" 2>/dev/null || cp tools/qa.js "$RUNNER_TEMP/qa.js"
      - run: node "$RUNNER_TEMP/qa.js"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          QA_MODE: review

  deployed: # after a push to dev or main: proof that Render now serves this commit (API /health and site /version.txt), then a read-only browser check of the live site, red otherwise
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30 # verify-deploy gives up after 15; npm ci, the smoke check and the Sentry check (up to 5) take the rest
    env:
      SHA: ${{ github.sha }}
      API: ${{ github.ref_name == 'main' && 'https://immune-citadel-v4-api.onrender.com' || 'https://immune-citadel-v4-api-dev.onrender.com' }}
      SITE: ${{ github.ref_name == 'main' && 'https://immune-citadel-v4.onrender.com' || 'https://immune-citadel-v4-dev.onrender.com' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: node tools/verify-deploy.js
      - run: npm ci # for Playwright and its Chromium
      # A failure counts only while this commit is still the branch head: Render may already serve a newer one, whose own run checks it.
      - run: |
          node tools/smoke.js "$SITE" "$API" "$SHA" || { head=$(gh api "repos/$GITHUB_REPOSITORY/branches/$GITHUB_REF_NAME" -q .commit.sha) && [ "$head" != "$SHA" ] && echo "superseded: the branch is now at $head, its own run checks that commit"; }
      # Monitoring still works: one save on the live API, under a trace ID chosen here, must reach Sentry as a trace, a log line and a
      # metric within 5 minutes, or this goes red and GitHub emails the owner. It overwrites one fixed save code, so the database never grows.
      - run: node tools/verify-sentry.js
        env: { SENTRY_AUTH_TOKEN: '${{ secrets.SENTRY_AUTH_TOKEN }}' }
